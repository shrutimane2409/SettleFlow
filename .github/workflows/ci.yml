name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - run: dotnet restore SettleFlow.sln
      - name: Formatting (dotnet format)
        run: dotnet format whitespace SettleFlow.sln --verify-no-changes
      - run: dotnet build SettleFlow.sln --configuration Release --no-restore -warnaserror
      - name: Unit tests
        run: dotnet test tests/SettleFlow.Tests --configuration Release --no-build
      - name: End-to-end tests (Postgres + Redpanda via Testcontainers)
        run: dotnet test tests/SettleFlow.IntegrationTests --configuration Release --no-build
      - name: Migrations are up to date with the model
        run: |
          dotnet tool restore
          dotnet dotnet-ef migrations has-pending-model-changes \
            --project src/SettleFlow.Infrastructure --startup-project src/SettleFlow.Infrastructure

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - name: Formatting (Prettier)
        run: npm run format:check
      - name: Unit tests (node --test)
        run: npm test
      - name: Dashboard types match the API contract (openapi.json)
        run: npm run check:contract
      - run: npm run build

  config:
    name: Monitoring & deployment config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Prometheus alert & SLO rules
        run: docker run --rm --entrypoint promtool -v "$PWD/monitoring:/m" prom/prometheus:v3.5.0 check rules /m/alerts.yml
      - name: Validate Alertmanager config
        run: docker run --rm --entrypoint amtool -v "$PWD/monitoring:/m" prom/alertmanager:v0.28.1 check-config /m/alertmanager.yml
      - uses: azure/setup-helm@v5
      - name: Lint and render the Helm chart
        run: |
          helm lint helm/settleflow
          helm template t helm/settleflow --set keda.enabled=true > /dev/null
      - name: Validate docker compose
        run: docker compose config -q

  images:
    needs: [backend, frontend, config]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    strategy:
      matrix:
        include:
          - { name: api, dockerfile: src/SettleFlow.Api/Dockerfile, context: . }
          - { name: fraud-worker, dockerfile: src/SettleFlow.FraudWorker/Dockerfile, context: . }
          - { name: settlement-worker, dockerfile: src/SettleFlow.SettlementWorker/Dockerfile, context: . }
          - { name: notification-worker, dockerfile: src/SettleFlow.NotificationWorker/Dockerfile, context: . }
          - { name: frontend, dockerfile: frontend/Dockerfile, context: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/settleflow-${{ matrix.name }}:latest
            ghcr.io/${{ github.repository_owner }}/settleflow-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/settleflow-${{ matrix.name }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/settleflow-${{ matrix.name }}:latest
          docker push ghcr.io/${{ github.repository_owner }}/settleflow-${{ matrix.name }}:${{ github.sha }}
