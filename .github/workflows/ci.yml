name: CI
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - run: dotnet restore SettleFlow.sln
      - run: dotnet build SettleFlow.sln --configuration Release --no-restore
      - run: dotnet test tests/SettleFlow.IntegrationTests/SettleFlow.IntegrationTests.csproj --configuration Release
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - working-directory: frontend
        run: npm install && npm run build
