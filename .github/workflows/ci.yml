name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - run: dotnet restore SettleFlow.sln
      - run: dotnet build SettleFlow.sln --configuration Release --no-restore -warnaserror
      - name: Unit tests
        run: dotnet test tests/SettleFlow.Tests --configuration Release --no-build
      - name: End-to-end tests (Postgres + Redpanda via Testcontainers)
        run: dotnet test tests/SettleFlow.IntegrationTests --configuration Release --no-build
      - name: Migrations are up to date with the model
        run: |
          dotnet tool restore
          dotnet dotnet-ef migrations has-pending-model-changes \
            --project src/SettleFlow.Infrastructure --startup-project src/SettleFlow.Infrastructure

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build

  images:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    strategy:
      matrix:
        include:
          - { name: api, dockerfile: src/SettleFlow.Api/Dockerfile, context: . }
          - { name: fraud-worker, dockerfile: src/SettleFlow.FraudWorker/Dockerfile, context: . }
          - { name: settlement-worker, dockerfile: src/SettleFlow.SettlementWorker/Dockerfile, context: . }
          - { name: notification-worker, dockerfile: src/SettleFlow.NotificationWorker/Dockerfile, context: . }
          - { name: frontend, dockerfile: frontend/Dockerfile, context: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/settleflow-${{ matrix.name }}:latest
            ghcr.io/${{ github.repository_owner }}/settleflow-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
