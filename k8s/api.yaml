apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: settleflow
spec:
  replicas: 1
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api } }
    spec:
      containers:
        - name: api
          image: ghcr.io/YOUR_GITHUB_USER/settleflow-api:latest
          env:
            - name: ConnectionStrings__Postgres
              valueFrom: { secretKeyRef: { name: settleflow-secrets, key: postgres } }
            - name: Kafka__BootstrapServers
              value: redpanda:9092
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          readinessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 10
          livenessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 30
