apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-worker
  namespace: settleflow
  labels: { app: notification-worker, app.kubernetes.io/part-of: settleflow }
spec:
  replicas: 1   # safe to scale: outbox rows are claimed with SKIP LOCKED, consumers share a Kafka group
  selector: { matchLabels: { app: notification-worker } }
  template:
    metadata:
      labels: { app: notification-worker, app.kubernetes.io/part-of: settleflow }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      securityContext: { runAsNonRoot: true }
      containers:
        - name: notification-worker
          image: ghcr.io/shrutii09/settleflow-notification-workeratest
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - name: ConnectionStrings__Postgres
              valueFrom: { secretKeyRef: { name: settleflow-secrets, key: postgres } }
            - name: Kafka__BootstrapServers
              value: redpanda:9092
            - name: Kafka__GroupId
              value: settleflow-notification
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://jaeger-collector:4317
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true }
          startupProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 15
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
