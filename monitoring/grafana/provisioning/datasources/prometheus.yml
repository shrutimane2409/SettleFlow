apiVersion: 1
# Recreate on every start so changes here (e.g. uids the dashboards refer to) always apply.
deleteDatasources:
  - { name: Prometheus, orgId: 1 }
  - { name: Loki, orgId: 1 }
  - { name: Jaeger, orgId: 1 }
  - { name: Alertmanager, orgId: 1 }
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      # Every log line carries the trace id: click it to open the whole distributed trace in Jaeger.
      derivedFields:
        - name: TraceId
          matcherRegex: '"TraceId":"([0-9a-f]{32})"'
          url: "$${__value.raw}"
          datasourceUid: jaeger

  - name: Jaeger
    uid: jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686

  - name: Alertmanager
    uid: alertmanager
    type: alertmanager
    access: proxy
    url: http://alertmanager:9093
    jsonData: { implementation: prometheus }
