global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: settleflow
    metrics_path: /metrics
    static_configs:
      - targets: ['api:8080']
        labels: { service: api }
      - targets: ['fraud-worker:8080']
        labels: { service: fraud-worker }
      - targets: ['settlement-worker:8080']
        labels: { service: settlement-worker }
      - targets: ['notification-worker:8080']
        labels: { service: notification-worker }
