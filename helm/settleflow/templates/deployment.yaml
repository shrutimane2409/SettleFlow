{{- range $name, $svc := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels: { app: {{ $name }}, app.kubernetes.io/instance: {{ $.Release.Name }}, app.kubernetes.io/part-of: settleflow }
spec:
  {{- if not (and $svc.hpa $svc.hpa.enabled) }}
  replicas: {{ $svc.replicas }}
  {{- end }}
  selector: { matchLabels: { app: {{ $name }}, app.kubernetes.io/instance: {{ $.Release.Name }} } }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: {{ $name }}, app.kubernetes.io/instance: {{ $.Release.Name }} }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      # Longer than the app's 30s shutdown timeout: readiness goes red first (draining check), then work finishes.
      terminationGracePeriodSeconds: 40
      securityContext: { runAsNonRoot: true }
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.image.registry }}/settleflow-{{ $name }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports: [{ name: http, containerPort: 8080 }]
          env:
            {{- include "settleflow.env" (dict "root" $ "svc" $svc) | nindent 12 }}
            {{- if $svc.expose }}
            {{- include "settleflow.apiSecrets" $ | nindent 12 }}
            - name: ASPNETCORE_FORWARDEDHEADERS_ENABLED
              value: "true"
            {{- end }}
            {{- range $k, $v := $svc.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          resources: {{- toYaml $.Values.resources | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true }
          startupProbe: { httpGet: { path: /health/live, port: http }, periodSeconds: 2, failureThreshold: 150 }
          readinessProbe: { httpGet: { path: /health/ready, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health/live, port: http }, periodSeconds: 15 }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
{{- end }}
