{{- range $name, $svc := .Values.services }}
{{- if $svc.expose }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
spec:
  selector: { app: {{ $name }}, app.kubernetes.io/instance: {{ $.Release.Name }} }
  ports: [{ name: http, port: 80, targetPort: http }]
{{- end }}
{{- end }}
