image:
  registry: ghcr.io/shrutii09
  tag: latest
  pullPolicy: IfNotPresent

# Secret holding the Postgres connection string under key "postgres".
postgresSecret: settleflow-secrets

kafka:
  bootstrapServers: redpanda:9092

# Leave empty to disable trace export.
otlpEndpoint: http://jaeger-collector:4317

resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { cpu: 500m, memory: 512Mi }

services:
  api:
    replicas: 2
    groupId: settleflow-api
    expose: true
  fraud-worker:
    replicas: 2
    groupId: settleflow-fraud
  settlement-worker:
    replicas: 2
    groupId: settleflow-settlement
    env:
      Settlement__TransientFailureRate: "0.1"
  notification-worker:
    replicas: 1
    groupId: settleflow-notification
