server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;

    # Security headers. inline styles are needed for React style={} props; no inline scripts are allowed.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # The dashboard calls the API on the same origin; nginx forwards to the api container.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Live event stream (Server-Sent Events): don't buffer.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location /health {
        proxy_pass http://api:8080;
    }

    # Hashed build assets can be cached forever.
    # Note: no add_header inside these blocks, otherwise nginx drops the server-level security headers.
    location /assets/ {
        expires 1y;
    }

    location / {
        try_files $uri /index.html;
        expires -1;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
